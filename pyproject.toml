[project]
name = "leakgame"
version = "1.0.0"
description = "Leak or Keep? Learning to share interview questions among competing candidates (Bayesian game + multi-agent bandits)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=2.0",       # np.bitwise_count (NumPy 2.0+) is used for leak counts and action popcounts
    "scipy>=1.11",
    "matplotlib>=3.8",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["leakgame"]

[tool.pytest.ini_options]
testpaths = ["tests"]
